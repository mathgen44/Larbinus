<!doctype html>
<html lang="fr" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Larbinus</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
<div class="application">

  <aside class="panneau" id="panneau">
    <button id="nouvelle" class="bouton-plein">+ Nouvelle conversation</button>
    <nav class="liste" id="liste-conversations" aria-label="Conversations"></nav>
    <p class="liste-vide" id="liste-vide">Aucune conversation enregistrée.</p>
    <button id="gerer-documents" class="bouton-discret">Documents</button>
    <button id="gerer-personas" class="bouton-discret">Gérer les larbins</button>
  </aside>

  <div class="voile" id="voile" hidden></div>

  <div class="colonne">
    <header class="barre">
      <button id="menu" class="bouton-icone" title="Conversations" aria-expanded="false">☰</button>

      <div class="marque">
        <span class="pastille" id="pastille" title="État du service"></span>
        <strong>Larbinus</strong>
      </div>

      <label class="champ-modele">
        <span class="sr-only">Modèle</span>
        <select id="modele" aria-label="Modèle"></select>
      </label>

      <div class="actions-barre">
        <button id="exporter" class="bouton-icone" title="Exporter en Markdown" hidden>⭳</button>
        <button id="reglages-bouton" class="bouton-icone" title="Réglages" aria-expanded="false">⚙</button>
        <button id="theme-bouton" class="bouton-texte" title="Thème">auto</button>
      </div>
    </header>

    <section id="reglages" class="reglages" hidden>
      <label>
        Prompt système
        <textarea id="prompt-systeme" rows="3"
                  placeholder="Optionnel — ex. « Réponds en français, de façon concise. »"></textarea>
      </label>
      <label class="ligne-temperature">
        Température <output id="temperature-valeur">0.7</output>
        <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
      </label>
      <label class="ligne-bascule">
        <input type="checkbox" id="rag-actif">
        <span>Interroger mes documents <em id="rag-etat"></em></span>
      </label>
      <p class="note">Le prompt système est enregistré avec la conversation en cours.</p>
    </section>

    <main id="fil" class="fil" aria-live="polite">
      <div class="accueil" id="accueil">
        <h1>Larbinus</h1>
        <p>Passerelle vers vos modèles, locaux et en ligne.</p>
        <p class="accueil-etat" id="accueil-etat">Chargement des modèles…</p>
        <div class="personas" id="personas"></div>
      </div>
    </main>

    <form class="composeur" id="composeur">
      <textarea id="saisie" rows="1" placeholder="Écrivez votre message…"
                title="Entrée pour envoyer, Maj+Entrée pour un retour à la ligne"></textarea>
      <button type="submit" id="envoyer" title="Envoyer">↑</button>
      <button type="button" id="arreter" title="Arrêter la génération" hidden>■</button>
    </form>
  </div>
</div>

<dialog id="modale-documents" class="modale">
  <form method="dialog" class="modale-entete">
    <strong>Documents</strong>
    <button class="bouton-icone" value="fermer" title="Fermer">✕</button>
  </form>

  <div class="modale-corps documents-corps">
    <div class="depot" id="depot">
      <p><strong>Glissez vos fichiers ici</strong></p>
      <p class="note" id="depot-formats"></p>
      <button type="button" class="bouton-accent" id="depot-parcourir">Parcourir…</button>
      <input type="file" id="depot-fichiers" multiple hidden>
    </div>

    <div class="documents-barre">
      <span class="note" id="documents-etat">Chargement…</span>
      <div class="documents-actions">
        <button type="button" class="bouton-plein" id="documents-reprendre" hidden>
          Réessayer les échecs
        </button>
        <button type="button" class="bouton-plein" id="documents-scan">
          Scanner le dossier surveillé
        </button>
      </div>
    </div>

    <div class="documents-liste" id="documents-liste"></div>
  </div>
</dialog>

<dialog id="modale-personas" class="modale">
  <form method="dialog" class="modale-entete">
    <strong>Larbins</strong>
    <button class="bouton-icone" value="fermer" title="Fermer">✕</button>
  </form>

  <div class="modale-corps">
    <div class="modale-liste" id="personas-liste"></div>

    <form id="persona-formulaire" class="persona-formulaire">
      <input type="hidden" id="persona-id">
      <div class="ligne-deux">
        <label>Icône
          <input id="persona-icone" maxlength="4" placeholder="🙂"
                 title="Un emoji — cliquez-en un ci-dessous, ou saisissez le vôtre">
        </label>
        <label>Nom
          <input id="persona-nom" required maxlength="80" placeholder="Correcteur">
        </label>
      </div>
      <div class="palette-icones" id="palette-icones" role="group"
           aria-label="Icônes proposées"></div>
      <label>Description
        <input id="persona-description" maxlength="300"
               placeholder="Ce que fait ce larbin, en une ligne">
      </label>
      <label>Prompt système
        <textarea id="persona-systeme" rows="5"
                  placeholder="Tu es… Réponds…"></textarea>
      </label>
      <div class="ligne-deux">
        <label>Modèle par défaut
          <select id="persona-modele"></select>
        </label>
        <label>Température <output id="persona-temperature-valeur">0.7</output>
          <input type="range" id="persona-temperature" min="0" max="2" step="0.1" value="0.7">
        </label>
      </div>
      <div class="modale-actions">
        <button type="button" id="persona-annuler" class="bouton-plein" hidden>Supprimer</button>
        <button type="submit" class="bouton-accent">Enregistrer</button>
      </div>
    </form>
  </div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
